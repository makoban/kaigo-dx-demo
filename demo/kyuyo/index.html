<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
<title>給与の計算｜デモ</title>
<link rel="stylesheet" href="../assets/demo.css?v=2">
<style>
.line{display:flex;align-items:center;gap:13px;background:#fff;border:2px solid var(--line);
  border-radius:13px;padding:14px 16px;margin-bottom:9px}
.line .nm{flex:1;min-width:0;font-size:16px;font-weight:700;line-height:1.5}
.line .nm small{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.line .amt{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.line.edit{cursor:pointer;border-style:dashed;border-color:#9dbdd8}
.line.edit:hover{border-color:var(--ac);background:var(--acs)}
.line.edit .amt{color:var(--ac)}
.line.mod{border-color:#e8cdb4;background:var(--wns)}
.line.mod .amt{color:var(--wn)}
.total{display:flex;align-items:center;gap:16px;background:var(--acs);border:2px solid #9dbdd8;
  border-radius:16px;padding:18px 20px;margin:14px 0}
.total .l{font-size:15px;font-weight:800;color:var(--ac2);flex:1}
.total .n{font-size:clamp(26px,5vw,34px);font-weight:800;color:var(--ac2);
  font-family:"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.dlg{position:fixed;inset:0;background:rgba(24,34,44,.55);display:grid;place-items:center;padding:18px;z-index:50}
.dlg .bx{background:#fff;border-radius:18px;max-width:440px;width:100%}
.dlg .hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dlg .hd h3{margin:0;font-size:19px;font-weight:800}
.dlg .bd{padding:20px 22px 22px}
.shift{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:12px}
.shift .dh{text-align:center;font-weight:800;color:var(--mute);font-size:11.5px;padding:3px 0}
.shift .c{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-weight:800}
.shift .c.n{background:#dbe6f2;color:#1d4265}
.shift .c.d{background:#fbeedc;color:#8a5a34}
.shift .c.e{background:#e4eee7;color:#255a40}
.shift .c.o{background:var(--head);color:#c3bdb3}
</style>
</head>
<body>

<header class="appbar">
  <div class="in">
    <a class="back" href="../">← もどる</a>
    <h1>給与の計算</h1>
    <span class="tagdemo">DEMO</span>
  </div>
</header>

<div class="wrap narrow">

  <div class="irow wn">
    <img class="ic" src="../assets/icon/money.png" alt="">
    <span class="t">点線の金額は<b>その場で直せます</b></span>
  </div>

  <div class="panel">
    <h2><img class="ic sm" src="../assets/icon/money.png" alt="">8月分　佐藤 ミカさん</h2>
    <div class="pad">
      <div id="lines"></div>
      <div class="total">
        <img class="ic lg" src="../assets/icon/money.png" alt="">
        <span class="l">お支払い</span>
        <span class="n" id="total">—</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2><img class="ic sm" src="../assets/icon/calendar.png" alt="">8月のシフト<span class="r">夜勤5回</span></h2>
    <div class="pad">
      <div class="shift" id="cal"></div>
    </div>
  </div>

  <div class="panel">
    <h2><img class="ic sm" src="../assets/icon/check.png" alt="">直した記録<span class="r" id="hcount">0件</span></h2>
    <div class="pad" id="hist">
      <p style="color:var(--mute);font-size:14.5px;margin:0;text-align:center">
        まだありません。<br>上の点線の金額を押してみてください。</p>
    </div>
  </div>

  <div class="irow gd">
    <img class="ic" src="../assets/icon/check.png" alt="">
    <span class="t">直した理由が残るので、<b>あとから説明できます</b></span>
  </div>
  <div class="irow gd" style="margin-bottom:0">
    <img class="ic" src="../assets/icon/check.png" alt="">
    <span class="t">職員に聞かれても、<b>その場で答えられます</b></span>
  </div>

</div>

<div class="dlg hide" id="dlg">
  <div class="bx">
    <div class="hd"><img class="ic" src="../assets/icon/money.png" alt=""><h3 id="dt"></h3></div>
    <div class="bd">
      <div class="fg"><label class="fl">いくらにしますか</label>
        <input type="text" id="dnew" inputmode="numeric" style="font-size:22px;font-weight:800;text-align:right"></div>
      <div class="fg"><label class="fl">なぜ直しましたか（必須）</label>
        <select id="dre" style="font-size:15px">
          <option value="">選んでください</option>
          <option>急な欠勤の代わりに出たため</option>
          <option>施設の決まりにもとづく配分</option>
          <option>シフト変更の反映もれを直した</option>
          <option>先月の計算まちがいを精算</option>
          <option>本人の申し出により確認して訂正</option>
        </select></div>
      <button class="act go" id="dok"><img class="ic lg" src="../assets/icon/check.png" alt="">
        <span><span class="t">これで直す</span></span><span class="arw">›</span></button>
      <button class="act" style="margin-top:9px" onclick="closeDlg()">
        <span style="width:44px"></span><span><span class="t">やめる</span></span></button>
    </div>
  </div>
</div>

<footer class="demo">
  デモ用のサンプルです。氏名・金額はすべて架空のものです。
</footer>

<script>
let ROWS = [
  {id:'k',  n:'基本給',        d:'月給',                v:218000, e:false},
  {id:'sk', n:'資格手当',      d:'介護福祉士',          v:15000,  e:false},
  {id:'ya', n:'夜勤手当',      d:'5回ぶん',             v:40000,  e:true},
  {id:'da', n:'代わりに出た日',d:'8/13・急な欠勤の対応',v:3000,   e:true},
  {id:'sy', n:'処遇改善加算',  d:'施設の決まりで配分',  v:26500,  e:true},
  {id:'zn', n:'時間外',        d:'6.5時間',             v:11200,  e:true},
  {id:'ts', n:'通勤手当',      d:'',                    v:8600,   e:false}
];
const SHIFT = ['','','','','','日','休','夜','明','休','日','早','遅','日','夜','明','休','日','休','早','夜','明','休','日','遅','日','夜','明','休','日','夜','明'];
const el = id => document.getElementById(id);
const yen = n => n.toLocaleString('ja-JP');
let hist = [], target = null;

function render(){
  el('lines').innerHTML = ROWS.map(r=>`
    <div class="line ${r.e?'edit':''} ${r.mod?'mod':''}" ${r.e?`data-id="${r.id}"`:''}>
      <img class="ic sm" src="../assets/icon/${r.mod?'check':(r.e?'money':'paper')}.png" alt="">
      <span class="nm">${r.n}${r.d?`<small>${r.d}</small>`:''}</span>
      <span class="amt">${yen(r.v)}円${r.e?' ✎':''}</span>
    </div>`).join('');
  el('total').textContent = yen(ROWS.reduce((s,r)=>s+r.v,0)) + '円';
  document.querySelectorAll('.line.edit').forEach(x=>x.onclick = ()=>openDlg(x.dataset.id));
}
function openDlg(id){
  target = ROWS.find(r=>r.id===id);
  el('dt').textContent = target.n;
  el('dnew').value = target.v;
  el('dre').value = '';
  el('dlg').classList.remove('hide');
  setTimeout(()=>el('dnew').select(), 60);
}
function closeDlg(){ el('dlg').classList.add('hide'); }

el('dok').onclick = () => {
  const nv = parseInt(String(el('dnew').value).replace(/[^0-9-]/g,''), 10);
  const re = el('dre').value;
  if (isNaN(nv)) { alert('金額を数字で入れてください。'); return; }
  if (!re) { alert('なぜ直したかを選んでください。\n\nここを必ず選ぶ形にしておくと、あとから説明できる記録になります。'); return; }
  const old = target.v;
  target.v = nv; target.mod = true;
  hist.unshift({n:target.n, o:old, v:nv, r:re});
  render(); renderHist(); closeDlg();
};
function renderHist(){
  el('hcount').textContent = hist.length + '件';
  el('hist').innerHTML = hist.map(h=>`
    <div class="irow wn fu"><img class="ic" src="../assets/icon/check.png" alt="">
    <span class="t"><b>${h.n}</b>　${yen(h.o)}円 → <b>${yen(h.v)}円</b>
    <small style="display:block;color:var(--mute);font-weight:600;font-size:13px">${h.r}<br>8月21日　佐藤（給与担当）</small></span></div>`).join('');
}
const DH = ['日','月','火','水','木','金','土'];
const map = {'日':'d','夜':'n','明':'n','早':'e','遅':'e','休':'o','':'o'};
el('cal').innerHTML = DH.map(d=>`<div class="dh">${d}</div>`).join('') +
  SHIFT.map(s=>`<div class="c ${map[s]||'o'}">${s}</div>`).join('');
render();
el('dlg').onclick = e => { if(e.target.id==='dlg') closeDlg(); };
</script>
</body>
</html>
