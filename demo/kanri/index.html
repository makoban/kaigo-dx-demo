<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
<title>問い合わせの管理｜デモ</title>
<link rel="stylesheet" href="../assets/demo.css?v=2">
<style>
.board{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:11px;min-width:900px}
.boardwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.col{background:var(--head);border:1px solid var(--line);border-radius:14px;padding:11px;min-height:260px}
.col h3{margin:0 0 10px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;
  justify-content:center;flex-direction:column;text-align:center}
.col h3 .c{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:12.5px}
.crd{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;
  cursor:pointer;transition:.13s;-webkit-tap-highlight-color:transparent;display:flex;gap:10px;align-items:flex-start}
.crd:hover{transform:translateY(-2px);border-color:var(--ac)}
.crd.old{border-color:#e0a49e;background:var(--dgs)}
.crd.warn{border-color:#e8cdb4;background:var(--wns)}
.crd .nm{font-weight:800;font-size:15px;line-height:1.45}
.crd .mt{font-size:12px;color:var(--mute);line-height:1.5;margin-top:2px}
.crd .ago{font-size:12.5px;font-weight:800;margin-top:5px;color:var(--mute)}
.crd.old .ago{color:var(--dg)} .crd.warn .ago{color:var(--wn)}
.dlg{position:fixed;inset:0;background:rgba(24,34,44,.55);display:grid;place-items:center;padding:18px;z-index:50}
.dlg .bx{background:#fff;border-radius:18px;max-width:480px;width:100%;max-height:86vh;overflow-y:auto}
.dlg .hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dlg .hd h3{margin:0;font-size:20px;font-weight:800;flex:1}
.dlg .hd button{border:none;background:var(--head);width:34px;height:34px;border-radius:10px;
  font-size:17px;cursor:pointer;color:var(--soft);flex:none}
.dlg .bd{padding:20px 22px 22px}
</style>
</head>
<body>

<header class="appbar">
  <div class="in">
    <a class="back" href="../">← もどる</a>
    <h1>問い合わせの管理</h1>
    <span class="tagdemo">DEMO</span>
  </div>
</header>

<div class="wrap">

  <div class="icards c3" style="margin-bottom:16px">
    <div class="icard"><img class="ic" src="../assets/icon/phone.png" alt=""><span class="v">10<small>件</small></span><span class="t">進行中</span></div>
    <div class="icard dg"><img class="ic" src="../assets/icon/alert.png" alt=""><span class="v">3<small>件</small></span><span class="t">止まっている</span></div>
    <div class="icard gd"><img class="ic" src="../assets/icon/check.png" alt=""><span class="v">2<small>件</small></span><span class="t">今月ご入居</span></div>
  </div>

  <div class="irow dg">
    <img class="ic" src="../assets/icon/alert.png" alt="">
    <span class="t">赤いカードが<b>2週間 動いていない方</b>です</span>
  </div>

  <div class="panel">
    <h2><img class="ic sm" src="../assets/icon/phone.png" alt="">カードを押すと中が見えます</h2>
    <div class="pad">
      <div class="boardwrap"><div class="board" id="board"></div></div>
    </div>
  </div>

  <div class="panel">
    <h2><img class="ic sm" src="../assets/icon/clock.png" alt="">どこで止まっているか</h2>
    <div class="pad">
      <div class="irow gd"><img class="ic" src="../assets/icon/check.png" alt=""><span class="t">問い合わせ　<b>2日</b>で次へ</span></div>
      <div class="irow gd"><img class="ic" src="../assets/icon/check.png" alt=""><span class="t">見学　<b>4日</b>で次へ</span></div>
      <div class="irow dg"><img class="ic" src="../assets/icon/alert.png" alt=""><span class="t">仮申込　<b>18日</b>止まる<br><small style="color:var(--mute);font-weight:600">ご家族が費用を持ち帰って考えている段階です</small></span></div>
      <div class="irow gd" style="margin-bottom:0"><img class="ic" src="../assets/icon/check.png" alt=""><span class="t">契約　<b>5日</b>でご入居</span></div>
      <div class="irow wn" style="margin-top:14px;margin-bottom:0">
        <img class="ic" src="../assets/icon/check.png" alt="">
        <span class="t">見学の日に見積書を渡せれば、<b>この18日は縮みます</b><br>
        <a href="../mitsumori/" style="font-size:14px">見積もりのデモを見る →</a></span>
      </div>
    </div>
  </div>

</div>

<div class="dlg hide" id="dlg">
  <div class="bx">
    <div class="hd"><img class="ic" id="dic" src="../assets/icon/phone.png" alt=""><h3 id="dnm"></h3>
      <button onclick="document.getElementById('dlg').classList.add('hide')">✕</button></div>
    <div class="bd" id="dbd"></div>
  </div>
</div>

<footer class="demo">
  デモ用のサンプルです。氏名・数値はすべて架空のものです。
</footer>

<script>
const STAGES = [
  {k:'問い合わせ', ic:'phone'}, {k:'見学', ic:'building'}, {k:'仮申込', ic:'paper'},
  {k:'契約', ic:'check'}, {k:'ご入居', ic:'family'}
];
const CARDS = [
  {s:0,n:'吉田 ノブコ 様',c:'要介護2',d:1,log:['8/20　ホームページから問い合わせ','8/20　電話。見学は8/24に決定']},
  {s:0,n:'加藤 マサヨ 様',c:'要介護3',d:3,log:['8/18　病院から紹介','8/18　退院は9月上旬の予定']},
  {s:0,n:'黒田 シゲ 様',c:'要支援2',d:9,log:['8/12　チラシを見て電話。費用だけ伝えた','その後、連絡していない']},
  {s:1,n:'斉藤 タカシ 様',c:'要介護4',d:2,log:['8/15　ケアマネから紹介','8/19　ご家族と見学','8/19　見積書をお渡しした']},
  {s:1,n:'柴田 ウメ 様',c:'要介護1',d:22,log:['7/26　問い合わせ','7/30　ご家族2名で見学。反応は良かった','その後、連絡が途切れている']},
  {s:1,n:'宮本 コウ 様',c:'要介護3',d:5,log:['8/09　クリニックから紹介','8/16　見学。他とも比べている']},
  {s:2,n:'岩崎 ハツ 様',c:'要介護2',d:4,log:['8/01　病院から紹介','8/06　見学','8/17　仮申込。書類を準備中']},
  {s:2,n:'野口 タツオ 様',c:'要介護4',d:26,log:['7/20　見学','7/26　仮申込。費用を持ち帰って検討','1か月 動きなし']},
  {s:2,n:'河合 ヨネ 様',c:'要介護3',d:16,log:['8/03　見学','8/05　仮申込','ご家族で意見が分かれている様子']},
  {s:3,n:'千葉 サブロウ 様',c:'要介護3',d:2,log:['8/12　仮申込','8/19　契約。ご入居は8/28']},
  {s:4,n:'高木 セツ 様',c:'要介護3',d:0,log:['8/05　契約','8/12　ご入居（107号室）']},
  {s:4,n:'新井 マサオ 様',c:'要介護4',d:0,log:['8/01　契約','8/08　ご入居（204号室）']}
];
const el = id => document.getElementById(id);
const cls = d => d>=14 ? 'old' : (d>=7 ? 'warn' : '');
const agoTx = d => d===0 ? 'ご入居ずみ' : (d>=14 ? d+'日 止まっている' : (d>=7 ? d+'日 動きなし' : d+'日前'));
const icOf = d => d>=14 ? 'alert' : (d>=7 ? 'clock' : 'check');

el('board').innerHTML = STAGES.map((st,i)=>{
  const list = CARDS.filter(c=>c.s===i);
  return `<div class="col"><h3><img class="ic sm" src="../assets/icon/${st.ic}.png" alt="">${st.k}<span class="c">${list.length}</span></h3>
    ${list.map(c=>`<div class="crd ${cls(c.d)}" data-n="${c.n}">
      <img class="ic sm" src="../assets/icon/${icOf(c.d)}.png" alt="">
      <div style="flex:1;min-width:0"><div class="nm">${c.n}</div><div class="mt">${c.c}</div>
      <div class="ago">${agoTx(c.d)}</div></div></div>`).join('')}</div>`;
}).join('');

document.querySelectorAll('.crd').forEach(cd=>{
  cd.onclick = () => {
    const c = CARDS.find(x=>x.n===cd.dataset.n);
    el('dnm').textContent = c.n;
    el('dic').src = '../assets/icon/'+icOf(c.d)+'.png';
    const warn = c.d>=14
      ? `<div class="irow dg" style="margin-top:0"><img class="ic" src="../assets/icon/alert.png" alt="">
         <span class="t"><b>${c.d}日 止まっています</b><br>
         <small style="color:var(--mute);font-weight:600">今日 連絡すれば、まだ間に合います</small></span></div>`
      : (c.d>=7 ? `<div class="irow wn" style="margin-top:0"><img class="ic" src="../assets/icon/clock.png" alt="">
         <span class="t">${c.d}日 動きがありません</span></div>` : '');
    el('dbd').innerHTML = warn +
      `<div class="irow"><img class="ic" src="../assets/icon/family.png" alt=""><span class="t">${c.c}</span></div>
       <div class="irow"><img class="ic" src="../assets/icon/${STAGES[c.s].ic}.png" alt=""><span class="t">いまは「${STAGES[c.s].k}」</span></div>
       <h4 style="margin:18px 0 10px;font-size:15px">これまでのやりとり</h4>
       ${c.log.map(l=>`<div class="irow" style="padding:11px 14px"><img class="ic sm" src="../assets/icon/check.png" alt="">
         <span class="t" style="font-size:14.5px;font-weight:600">${l}</span></div>`).join('')}
       <button class="act" style="margin-top:16px" onclick="alert('デモのため、実際には発信しません。')">
         <img class="ic lg" src="../assets/icon/phone.png" alt="">
         <span><span class="t">電話する</span></span><span class="arw">›</span></button>`;
    el('dlg').classList.remove('hide');
  };
});
el('dlg').onclick = e => { if(e.target.id==='dlg') el('dlg').classList.add('hide'); };
</script>
</body>
</html>
