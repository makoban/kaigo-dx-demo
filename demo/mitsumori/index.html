<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
<title>ご入居費用の見積もり｜デモ</title>
<link rel="stylesheet" href="../assets/demo.css?v=2">
<style>
body{padding-bottom:160px}
.opts{display:grid;gap:10px}
@media(min-width:600px){.opts.c2{grid-template-columns:1fr 1fr}.opts.c3{grid-template-columns:repeat(3,1fr)}}
.opt{position:relative;background:#fff;border:3px solid var(--line);border-radius:14px;
  padding:16px 18px;cursor:pointer;transition:.14s;display:block;-webkit-tap-highlight-color:transparent}
.opt:hover{border-color:#9dbdd8}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .t{font-weight:800;font-size:18px;line-height:1.45;display:block;padding-right:32px}
.opt .d{font-size:13px;color:var(--mute);line-height:1.55;margin-top:2px;display:block}
.opt::after{content:"";position:absolute;top:17px;right:17px;width:24px;height:24px;border-radius:50%;
  border:3px solid #ccc3b7;background:#fff;transition:.14s}
.opt:has(input:checked){border-color:var(--ac);background:var(--acs)}
.opt:has(input:checked)::after{border-color:var(--ac);background:var(--ac);box-shadow:inset 0 0 0 4px #fff}
.opt:has(input[type=checkbox]:checked){border-color:var(--gd);background:var(--gds)}
.opt:has(input[type=checkbox]:checked)::after{border-color:var(--gd);background:var(--gd);
  border-radius:7px;box-shadow:none}
.opt:has(input[type=checkbox])::after{border-radius:7px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
  border-top:2px solid var(--line);box-shadow:0 -3px 20px rgba(24,34,44,.1);z-index:20;padding:14px 0 16px}
.bar .in{max-width:1080px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar .l{font-size:13px;color:var(--mute);font-weight:700}
.bar .v{font-size:clamp(26px,5vw,34px);font-weight:800;color:var(--ac2);line-height:1.15;
  font-family:"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.bar .v small{font-size:16px;font-weight:700}
.bar .sub{font-size:13px;color:var(--mute);margin-top:1px}
.bar .go{margin-left:auto;background:var(--wn);color:#fff;border:none;border-radius:14px;
  padding:15px 28px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;
  display:flex;align-items:center;gap:11px}
.bar .go:hover{background:#96461a}
@media(max-width:560px){.bar .go{width:100%;margin-left:0;justify-content:center}}
.sheet{display:none;background:#fff;border:2px solid var(--line);border-radius:18px;padding:28px 24px;margin:24px 0}
.sheet.on{display:block}
.sheet h3{margin:0 0 20px;font-size:22px;font-weight:800;text-align:center;letter-spacing:.14em}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #ece6dd;font-size:16px}
.srow:last-of-type{border-bottom:none}
.srow .nm{flex:1;font-weight:700}
.srow .nm small{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.srow .am{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stot{display:flex;align-items:center;gap:16px;background:var(--acs);border-radius:14px;
  padding:18px 20px;margin-top:16px}
.stot .l{flex:1;font-size:16px;font-weight:800;color:var(--ac2)}
.stot .n{font-size:28px;font-weight:800;color:var(--ac2);font-family:"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums}
@media print{
  body{background:#fff;padding:0}
  .appbar,.panel,.bar,.irow,.flow,footer,.acts{display:none!important}
  .sheet{border:none;padding:0;margin:0}
}
</style>
</head>
<body>

<header class="appbar">
  <div class="in">
    <a class="back" href="../">← もどる</a>
    <h1>ご入居費用の見積もり</h1>
    <span class="tagdemo">DEMO</span>
  </div>
</header>

<div class="wrap narrow">

  <div class="irow">
    <img class="ic" src="../assets/icon/paper.png" alt="">
    <span class="t">選ぶだけで、<b>その場で見積書が出ます</b></span>
  </div>

  <div class="panel">
    <h2><img class="ic sm" src="../assets/icon/building.png" alt="">1　お部屋</h2>
    <div class="pad"><div class="opts c3" id="room"></div></div>
  </div>

  <div class="panel">
    <h2><img class="ic sm" src="../assets/icon/family.png" alt="">2　要介護度</h2>
    <div class="pad"><div class="opts c3" id="care"></div></div>
  </div>

  <div class="panel">
    <h2><img class="ic sm" src="../assets/icon/check.png" alt="">3　お食事</h2>
    <div class="pad"><div class="opts c3" id="meal"></div></div>
  </div>

  <div class="panel">
    <h2><img class="ic sm" src="../assets/icon/photo.png" alt="">4　あると安心なもの<span class="r">いくつでも</span></h2>
    <div class="pad"><div class="opts c2" id="opt"></div></div>
  </div>

  <div class="sheet" id="sheet">
    <h3>御 見 積 書</h3>
    <div id="lines"></div>
    <p class="fine" style="text-align:center;margin-top:18px">
      ※デモ用のサンプルです。実際の費用ではありません。<br>
      ※介護サービス費は自己負担1割として計算しています。<br>
      ※医療費・おむつ代・理美容代は含みません。</p>
    <button class="act" style="margin-top:18px" onclick="window.print()">
      <img class="ic lg" src="../assets/icon/print.png" alt="">
      <span><span class="t">印刷してお渡しする</span><span class="s">PDFでの保存もできます</span></span>
      <span class="arw">›</span>
    </button>
  </div>
</div>

<div class="bar">
  <div class="in">
    <img class="ic lg" src="../assets/icon/money.png" alt="">
    <div>
      <div class="l">毎月のお支払い</div>
      <div class="v" id="total">—</div>
      <div class="sub" id="init">はじめに：—</div>
    </div>
    <button class="go" onclick="makeSheet()">
      <img class="ic sm" src="../assets/icon/paper.png" alt="">見積書をつくる</button>
  </div>
</div>

<footer class="demo">
  デモ用のサンプルです。金額・施設情報はすべて架空のものです。
</footer>

<script>
const DATA = {
  room:[
    {id:'a',t:'ふつうのお部屋',d:'約31㎡',p:135000,dep:4},
    {id:'b',t:'広いお部屋',d:'約35㎡・お風呂つき',p:150000,dep:4},
    {id:'c',t:'ふたり部屋',d:'約45㎡・ご夫婦で',p:180000,dep:4}
  ],
  care:[
    {id:'n',t:'まだ申請中',d:'',p:0},{id:'s1',t:'要支援1',d:'',p:5000},{id:'s2',t:'要支援2',d:'',p:10500},
    {id:'k1',t:'要介護1',d:'',p:16800},{id:'k2',t:'要介護2',d:'',p:19700},{id:'k3',t:'要介護3',d:'',p:27100},
    {id:'k4',t:'要介護4',d:'',p:30900},{id:'k5',t:'要介護5',d:'',p:36200}
  ],
  meal:[
    {id:'m3',t:'1日3食',d:'',p:66000},{id:'m2',t:'1日2食',d:'朝と夕',p:45000},{id:'m0',t:'いらない',d:'',p:0}
  ],
  opt:[
    {id:'o1',t:'通院の付き添い',d:'月2回まで',p:6000},
    {id:'o2',t:'そうじ・洗濯',d:'',p:3000},
    {id:'o3',t:'体操・リハビリ',d:'',p:6000},
    {id:'o4',t:'ご家族へ写真を送る',d:'',p:2000}
  ],
  fixed:[
    {t:'管理費',d:'共用部分の維持',p:60000},
    {t:'生活支援',d:'24時間の見守り・相談',p:33000}
  ]
};
const yen = n => n.toLocaleString('ja-JP');
const el = id => document.getElementById(id);

function render(key, type){
  const box = el(key);
  box.innerHTML = DATA[key].map((o,i)=>`
    <label class="opt">
      <input type="${type}" name="${key}" value="${o.id}" ${type==='radio'&&i===0?'checked':''}>
      <span class="t">${o.t}</span>${o.d?`<span class="d">${o.d}</span>`:''}
    </label>`).join('');
  box.addEventListener('change', calc);
}
['room','care','meal'].forEach(k=>render(k,'radio'));
render('opt','checkbox');

function picked(){
  const one = k => DATA[k].find(o=>o.id===(document.querySelector(`input[name=${k}]:checked`)||{}).value);
  const many = [...document.querySelectorAll('input[name=opt]:checked')].map(el=>DATA.opt.find(o=>o.id===el.value));
  return {room:one('room'), care:one('care'), meal:one('meal'), opts:many};
}
function sum(p){
  return p.room.p + DATA.fixed.reduce((s,f)=>s+f.p,0) + (p.meal?p.meal.p:0)
       + (p.care?p.care.p:0) + p.opts.reduce((s,o)=>s+o.p,0);
}
function calc(){
  const p = picked(); if(!p.room) return;
  el('total').innerHTML = yen(sum(p))+'<small>円</small>';
  el('init').textContent = 'はじめに：' + yen(p.room.p*p.room.dep) + '円（敷金）';
}
function makeSheet(){
  const p = picked();
  const rows = [];
  const line = (ic,nm,d,am) => `<div class="srow"><img class="ic sm" src="../assets/icon/${ic}.png" alt="">
    <span class="nm">${nm}${d?`<small>${d}</small>`:''}</span><span class="am">${yen(am)}円</span></div>`;
  rows.push(line('building','お部屋', p.room.t+'（'+p.room.d+'）', p.room.p));
  DATA.fixed.forEach(f=>rows.push(line('check', f.t, f.d, f.p)));
  if(p.meal&&p.meal.p) rows.push(line('check','お食事', p.meal.t, p.meal.p));
  if(p.care&&p.care.p) rows.push(line('family','介護サービス', p.care.t+'・自己負担1割', p.care.p));
  p.opts.forEach(o=>rows.push(line('photo', o.t, '', o.p)));
  rows.push(`<div class="stot"><img class="ic lg" src="../assets/icon/money.png" alt="">
    <span class="l">毎月のお支払い</span><span class="n">${yen(sum(p))}円</span></div>`);
  rows.push(`<div class="stot" style="background:var(--wns);margin-top:10px">
    <img class="ic lg" src="../assets/icon/paper.png" alt="">
    <span class="l" style="color:#8a3f16">はじめに（敷金）</span>
    <span class="n" style="color:#8a3f16">${yen(p.room.p*p.room.dep)}円</span></div>`);
  el('lines').innerHTML = rows.join('');
  const s = el('sheet'); s.classList.add('on');
  s.scrollIntoView({behavior:'smooth', block:'start'});
}
calc();
</script>
</body>
</html>
